[pytest]
minversion = 6.2
log_level = INFO
log_format = %(asctime)s.%(msecs)03d %(message)s
log_date_format = %H:%M:%S
markers =
    log_allow(*regexes): allow matching WARN/ERR/EMER messages in daemon logs.
    requires(*features): skip the system test if features are not available.
    min_kernel(major, minor): skip the system test on older kernels.
    xdist_group(name): run tests of the group on one pytest-xdist worker.
